<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#e8c547"/>
  <!-- Rear wheel -->
  <circle cx="9" cy="20" r="6" fill="none" stroke="#111111" stroke-width="1.5"/>
  <!-- Front wheel -->
  <circle cx="23" cy="20" r="6" fill="none" stroke="#111111" stroke-width="1.5"/>
  <!-- Wheel hubs -->
  <circle cx="9" cy="20" r="1" fill="#111111"/>
  <circle cx="23" cy="20" r="1" fill="#111111"/>
  <!-- Frame, fork, seat, handlebars -->
  <g fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chainstay: bottom bracket → rear axle -->
    <line x1="16" y1="20" x2="9" y2="20"/>
    <!-- Seat tube: bottom bracket → seat cluster -->
    <line x1="16" y1="20" x2="12" y2="13"/>
    <!-- Top tube: seat cluster → head tube -->
    <line x1="12" y1="13" x2="21" y2="13"/>
    <!-- Down tube: head tube → bottom bracket -->
    <line x1="21" y1="13" x2="16" y2="20"/>
    <!-- Seat stay: seat cluster → rear axle -->
    <line x1="12" y1="13" x2="9" y2="20"/>
    <!-- Fork: head tube → front axle -->
    <line x1="21" y1="13" x2="23" y2="20"/>
    <!-- Seat post -->
    <line x1="12" y1="13" x2="11.5" y2="10"/>
    <!-- Saddle -->
    <line x1="9.5" y1="10" x2="13.5" y2="10"/>
    <!-- Stem -->
    <line x1="21" y1="13" x2="22" y2="10"/>
    <!-- Handlebar -->
    <line x1="20" y1="9.5" x2="24" y2="9.5"/>
  </g>
</svg>
